# PersonaRAG — single consolidated service.
# One container serves both Task A and Task B. The persona store is
# loaded into memory exactly once, so this comfortably fits in 16 GB.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: personarag_api
    ports:
      - "${PORT:-8080}:8080"
    env_file: .env
    environment:
      - PORT=8080
    volumes:
      # Bind-mount processed data so the image stays small.
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      # Startup is now ~5-10s (persona store is small), but we keep a
      # generous start_period so a slow disk never triggers a false kill.
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/health',timeout=5).status==200 else 1)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  ui:
    image: nginx:alpine
    container_name: personarag_ui
    ports:
      - "8081:80"
    volumes:
      - ./ui:/usr/share/nginx/html:ro
    restart: unless-stopped
    depends_on:
      - api
