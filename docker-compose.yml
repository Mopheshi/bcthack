services:
  task_a:
    build:
      context: .
      dockerfile: task_a/Dockerfile
    container_name: bct_task_a
    ports:
      - "${TASK_A_PORT:-8001}:8001"
    env_file: .env
    volumes:
      - ./data:/app/data          # parquet + chroma index
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s             # persona builder takes ~30s to load parquet

  task_b:
    build:
      context: .
      dockerfile: task_b/Dockerfile
    container_name: bct_task_b
    ports:
      - "${TASK_B_PORT:-8002}:8002"
    env_file: .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s